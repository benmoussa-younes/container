---
argument_specs:
  main:
    short_description: The site's rootless Quadlet declarations.
    description:
      - >-
        Writes Quadlet unit files into one rootless account's generator
        directory, reloads that account's user manager and reads every declared
        unit back through `systemctl --user cat`. It creates no image, volume,
        network, pod or container, and it never touches the rootful
        `/etc/containers/systemd` directory.
    author: Younes BENMOUSSA
    options:
      quadlet_enabled:
        type: bool
        required: false
        description: Whether the declarations are selected. False writes nothing.
      quadlet_user:
        type: str
        required: false
        description: >-
          The account that owns the units. It defaults to the name
          `roles/account` declares (`account_name`, `container` by default).
      quadlet_units:
        type: list
        elements: dict
        required: false
        description: >-
          One entry per unit file, with `name` (stem), `type` (container,
          volume, network, pod, image, build or kube), `state` (present or
          absent), `content` (the unit file, required when present), an optional
          `mode` (0600 by default: the unit text is the account's, not the
          host's), an optional `boot` that defaults to true: a container or
          kube unit must then carry `[Install]` with `WantedBy=` or
          `RequiredBy=`, because Quadlet starts nothing at boot without it
          (`boot: false` is the opt-out for a unit another unit starts), and an
          an optional `image_digest` that defaults to true: a `.container` or
          `.image` unit that names an image without `@sha256:` is refused while
          `quadlet_image_digest_required` is on, and `image_digest: false` is
          the per-unit opt-out, and an
          optional `dropins`: a list of `{name, content}` entries written into
          `<stem>.<type>.d/<name>`. Quadlet reads every `.conf` file there and
          merges it into the generated unit, which is the narrow way to relax
          one key of `quadlet_forbidden`; the product's own names
          (`quadlet_product_dropins`) are refused. The role records the list it
          wrote beside them and removes a drop-in dropped from the declaration.
      quadlet_product_dropins:
        type: list
        elements: str
        required: false
        description: >-
          The per-unit drop-ins the product owns. A declaration may not use
          those names, and withdrawing a unit removes them.
      quadlet_home:
        type: str
        required: false
        description: >-
          The owning account's home, read from its passwd record. Empty means
          the role resolves it; `quadlet_directory` derives from it.
      quadlet_directory:
        type: str
        required: false
        description: The rootless generator directory of the owning account.
      quadlet_reload:
        type: bool
        required: false
        description: Whether the user manager is reloaded after a change.
      quadlet_default_memory:
        type: str
        required: false
        description: >-
          The `MemoryMax=` value every container unit gets unless it declares
          its own, in systemd's units (`128M`). Empty writes no default. The
          role writes a per-unit drop-in only while the unit declares no
          `MemoryMax=`, because a drop-in wins over the unit file.
      quadlet_default_cpu_quota:
        type: str
        required: false
        description: >-
          The `CPUQuota=` value every container unit gets unless it declares
          its own (`50%`, where 100% is one thread). Empty writes no default,
          with the same drop-in rule as `quadlet_default_memory`.
      quadlet_image_digest_required:
        type: bool
        required: false
        description: >-
          Whether a `.container` or `.image` unit must name its image by digest
          (`@sha256:` with the full 64 hex characters). A `.kube` unit's images
          live in its YAML and a `.build` unit names a Containerfile the site
          owns; neither is parsed here.
      quadlet_verify:
        type: bool
        required: false
        description: Whether every declared unit is read back after the reload.
      quadlet_hardened_defaults:
        type: bool
        required: false
        description: >-
          Whether the product's global hardening drop-in is written for every
          container unit of the account (`NoNewPrivileges`, all capabilities
          dropped, read-only rootfs, init, pids and ulimit bounds, journald
          logs). A unit's own drop-in still wins.
      quadlet_hardened_pids_limit:
        type: int
        required: false
        description: The pids limit the hardening drop-in declares.
      quadlet_hardened_ulimit:
        type: str
        required: false
        description: The ulimit the hardening drop-in declares.
      quadlet_forbidden:
        type: list
        elements: str
        required: false
        description: >-
          Lines a declared container unit may not carry while the hardened
          defaults are on. Empty it to let a site declare any key.
      quadlet_forbidden_prefixes:
        type: list
        elements: str
        required: false
        description: >-
          Keys whose every value is refused in any declared unit while the
          hardened defaults are on: the arguments and sandbox keys that would
          bypass the drop-in (`PodmanArgs`, `GlobalArgs`, `Unmask`,
          `SeccompProfile`, `Privileged`). Empty it deliberately.
      quadlet_unprivileged_port_start:
        type: str
        required: false
        default: ""
        description: >-
          The host port floor a declared `PublishPort` must reach. Empty means
          the host's `net.ipv4.ip_unprivileged_port_start`, read from the
          kernel; a rootless engine cannot bind below it.
      quadlet_suffixes:
        type: dict
        required: false
        description: The generated unit suffix of each declaration type.
      quadlet_types:
        type: list
        elements: str
        required: false
        description: The declaration types this role accepts.
