---
# The site's Quadlet units. Nothing is pulled, created or started here.
- name: The Quadlet declarations are configured
  when: quadlet_enabled | bool
  block:
    - name: The owning account is declared
      ansible.builtin.assert:
        that:
          - quadlet_user | length > 0
          - quadlet_user != 'root'
        fail_msg: >-
          quadlet_user must name a non-root account. `roles/account` creates
          {{ account_name | default('container') }} by default; run it first, or
          declare quadlet_user and account_name for the account you own. The
          rootful generator reads /etc/containers/systemd and is not configured
          here.

    - name: The owning account is read
      ansible.builtin.getent:
        database: passwd
        key: "{{ quadlet_user }}"

    - name: The owning account's groups are read
      ansible.builtin.getent:
        database: group

    - name: The owning account exists
      ansible.builtin.assert:
        that:
          - quadlet_user in ansible_facts.getent_passwd
        fail_msg: >-
          {{ quadlet_user }} does not exist on this host. `roles/account` creates
          it (account_enabled: true); run it first, or declare quadlet_user for
          an account that exists.

    - name: The owning account's UID, GID and home are known
      ansible.builtin.set_fact:
        quadlet_uid: "{{ ansible_facts.getent_passwd[quadlet_user][1] }}"
        quadlet_gid: "{{ ansible_facts.getent_passwd[quadlet_user][2] }}"
        quadlet_home: "{{ ansible_facts.getent_passwd[quadlet_user][4] }}"

    - name: The unprivileged port floor is read
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: cat /proc/sys/net/ipv4/ip_unprivileged_port_start
      register: quadlet_port_floor
      changed_when: false
      when: quadlet_unprivileged_port_start | string | length == 0

    - name: The owning account's primary group is known
      ansible.builtin.set_fact:
        quadlet_group: >-
          {{ ansible_facts.getent_group | dict2items
             | selectattr('value.1', 'equalto', quadlet_gid)
             | map(attribute='key') | list | first }}

    # A declaration is validated before anything is written: a typo must fail
    # the run, not leave a unit the generator silently ignores.
    - name: Every declaration is complete
      ansible.builtin.assert:
        that:
          - item.name is defined and item.name | length > 0
          - item.name is match('^[A-Za-z0-9][A-Za-z0-9_.@-]*$')
          - item.name is not search('\\.(container|volume|network|pod|image|build|kube)$')
          - item.type is defined and item.type in quadlet_types
          - (item.state | default('present')) in ['present', 'absent']
          - (item.state | default('present')) == 'absent' or item.content is defined
        fail_msg: >-
          `{{ item | to_json }}` is not a complete declaration: it needs a name
          without suffix, a known type and, unless it is absent, a content.
        quiet: true
      loop: "{{ quadlet_units }}"
      loop_control:
        label: "{{ item.name | default('?') }}"

    - name: The declarations are keyed once
      ansible.builtin.set_fact:
        quadlet_declared: >-
          {{ quadlet_units | map(attribute='name')
             | zip(quadlet_units | map(attribute='type'))
             | map('join', '.') | list }}

    - name: Every declaration is unique
      ansible.builtin.assert:
        that:
          - quadlet_declared | unique | list | length == quadlet_declared | length
        fail_msg: >-
          Two declarations share a name and a type, and the second overwrites
          the first: declared {{ quadlet_declared | join(', ') }}. Give one of
          them another name.
        quiet: true

    # Quadlet applies `[Install]` at generation and starts nothing at boot
    # without it, so a container unit that never says how it starts is a unit
    # that never comes back after a reboot. `boot: false` is the explicit
    # opt-out for a unit another one starts.
    - name: Every container or kube unit can start at boot, or says it must not
      ansible.builtin.assert:
        that:
          - (item.content is search('(?m)^[ \t]*\[Install\][ \t]*$')
             and (item.content is search('(?mi)^[ \t]*WantedBy[ \t]*=')
                  or item.content is search('(?mi)^[ \t]*RequiredBy[ \t]*=')))
        fail_msg: >-
          `{{ item.name }}` declares no `[Install]` section, so Quadlet generates
          the unit and it never starts at boot. Add `WantedBy=default.target`, or
          declare `boot: false` for a unit another one starts.
        quiet: true
      loop: "{{ quadlet_units }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - (item.type | default('')) in ['container', 'kube']
        - (item.state | default('present')) == 'present'
        - item.boot | default(true) | bool

    - name: The generator directory exists
      ansible.builtin.file:
        path: "{{ quadlet_directory }}"
        state: directory
        owner: "{{ quadlet_user }}"
        group: "{{ quadlet_group }}"
        mode: "0755"

    - name: The global hardening directory exists
      ansible.builtin.file:
        path: "{{ quadlet_directory }}/container.d"
        state: directory
        owner: "{{ quadlet_user }}"
        group: "{{ quadlet_group }}"
        mode: "0755"
      when: quadlet_hardened_defaults | bool

    - name: The product's hardening drop-in is declared
      ansible.builtin.template:
        src: hardening-dropin.j2
        dest: "{{ quadlet_directory }}/container.d/10-container-edition.conf"
        owner: "{{ quadlet_user }}"
        group: "{{ quadlet_group }}"
        mode: "0644"
      when: quadlet_hardened_defaults | bool
      notify: Reload the user manager

    - name: The product's hardening drop-in is withdrawn when the switch is off
      ansible.builtin.file:
        path: "{{ quadlet_directory }}/container.d/10-container-edition.conf"
        state: absent
      when: not (quadlet_hardened_defaults | bool)
      notify: Reload the user manager

    - name: The read-back has a manager to read
      ansible.builtin.assert:
        that:
          - not (quadlet_verify | bool) or (quadlet_reload | bool)
        fail_msg: >-
          quadlet_verify requires quadlet_reload: a generated unit exists only
          after the account's user manager reloads, so the read-back would fail
          on a unit that was written correctly.
        quiet: true

    - name: The forbidden declarations are compiled once
      ansible.builtin.set_fact:
        quadlet_forbidden_pattern: >-
          {{ '(?m)^[ \t]*('
             ~ (quadlet_forbidden | map('regex_escape')
                | map('regex_replace', '=', '[ \t]*=[ \t]*') | join('|'))
             ~ ')[ \t]*$' }}
      when:
        - quadlet_hardened_defaults | bool
        - quadlet_forbidden | length > 0

    - name: No declared container unit relaxes the hardening defaults
      ansible.builtin.assert:
        that:
          - item.content is not search(quadlet_forbidden_pattern)
        fail_msg: >-
          `{{ item.name }}` declares a key the product forbids while the
          hardened defaults are on: {{ quadlet_forbidden | join(', ') }}.
          Remove it, or add a drop-in beside the unit
          (`{{ item.name }}.container.d/`) that relaxes the one key it needs,
          or empty `quadlet_forbidden` deliberately.
        quiet: true
      loop: "{{ quadlet_units }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - quadlet_hardened_defaults | bool
        - quadlet_forbidden | length > 0
        - (item.type | default('')) == 'container'
        - (item.state | default('present')) == 'present'

    - name: Every published host port is above the unprivileged floor
      ansible.builtin.assert:
        that:
          - quadlet_published_ports | select('lt', quadlet_effective_port_start | int) | list | length == 0
        fail_msg: >-
          `{{ item.name }}` publishes a host port below this host's
          unprivileged floor ({{ quadlet_effective_port_start }}):
          {{ quadlet_published_ports | join(', ') | default('none', true) }}.
          Lower `net.ipv4.ip_unprivileged_port_start`, or publish a higher
          host port.
        quiet: true
      loop: "{{ quadlet_units }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - (item.type | default('')) == 'container'
        - (item.state | default('present')) == 'present'
      vars:
        quadlet_effective_port_start: >-
          {{ quadlet_unprivileged_port_start
             if quadlet_unprivileged_port_start | string | length > 0
             else quadlet_port_floor.stdout | default('0') | trim }}
        quadlet_published_ports: >-
          {{ item.content | default('')
             | regex_findall('(?m)^[ \t]*PublishPort[ \t]*=[ \t]*[^\n]+')
             | map('regex_findall', '[=:]([0-9]+):[0-9]+') | flatten
             | map('int') | list }}

    - name: The declared units are written
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ quadlet_directory }}/{{ item.name }}.{{ item.type }}"
        owner: "{{ quadlet_user }}"
        group: "{{ quadlet_group }}"
        mode: "{{ item.mode | default('0644') }}"
      loop: "{{ quadlet_units }}"
      loop_control:
        label: "{{ item.name }}.{{ item.type }}"
      when: (item.state | default('present')) == 'present'
      notify: Reload the user manager

    # The default bounds are a site budget, not a hardening key: they are
    # written per unit, and only while the unit declares no such key, because a
    # Quadlet drop-in overrides the unit file.
    # Both keys are always compiled, with an empty value meaning "no default":
    # that is what lets an emptied default remove the drop-in it wrote before.
    - name: The default bounds are compiled once
      ansible.builtin.set_fact:
        quadlet_default_bounds:
          - { key: MemoryMax, value: "{{ quadlet_default_memory }}", file: 50-default-memory.conf }
          - { key: CPUQuota, value: "{{ quadlet_default_cpu_quota }}", file: 51-default-cpu.conf }

    - name: The directories of the default bounds exist
      ansible.builtin.file:
        path: "{{ quadlet_directory }}/{{ item.0.name }}.container.d"
        state: directory
        owner: "{{ quadlet_user }}"
        group: "{{ quadlet_group }}"
        mode: "0755"
      loop: "{{ quadlet_units | product(quadlet_default_bounds) | list }}"
      loop_control:
        label: "{{ item.0.name }}.{{ item.1.file }}"
      when:
        - (item.0.type | default('')) == 'container'
        - (item.0.state | default('present')) == 'present'
        - item.1.value | length > 0
        - (item.0.content | default('')) is not search('(?m)^[ \t]*' ~ (item.1.key | regex_escape) ~ '[ \t]*=')

    - name: The default bounds are written where the unit declares none
      ansible.builtin.copy:
        content: |
          # Managed by Ansible: the site's default bound. The unit declares no
          # {{ item.1.key }}=, so this drop-in is what gives it one. Declaring
          # the key in the unit removes this file, and the unit wins.
          [Service]
          {{ item.1.key }}={{ item.1.value }}
        dest: "{{ quadlet_directory }}/{{ item.0.name }}.container.d/{{ item.1.file }}"
        owner: "{{ quadlet_user }}"
        group: "{{ quadlet_group }}"
        mode: "0644"
      loop: "{{ quadlet_units | product(quadlet_default_bounds) | list }}"
      loop_control:
        label: "{{ item.0.name }}.{{ item.1.file }}"
      when:
        - (item.0.type | default('')) == 'container'
        - (item.0.state | default('present')) == 'present'
        - item.1.value | length > 0
        - (item.0.content | default('')) is not search('(?m)^[ \t]*' ~ (item.1.key | regex_escape) ~ '[ \t]*=')
      notify: Reload the user manager

    - name: A bound the unit declares itself is not shadowed
      ansible.builtin.file:
        path: "{{ quadlet_directory }}/{{ item.0.name }}.container.d/{{ item.1.file }}"
        state: absent
      loop: "{{ quadlet_units | product(quadlet_default_bounds) | list }}"
      loop_control:
        label: "{{ item.0.name }}.{{ item.1.file }}"
      when: >-
        (item.0.type | default('')) == 'container'
        and ((item.0.content | default('')) is search('(?m)^[ \t]*' ~ (item.1.key | regex_escape) ~ '[ \t]*=')
             or item.1.value | length == 0)
      notify: Reload the user manager

    - name: The withdrawn units are removed
      ansible.builtin.file:
        path: "{{ quadlet_directory }}/{{ item.name }}.{{ item.type }}"
        state: absent
      loop: "{{ quadlet_units }}"
      loop_control:
        label: "{{ item.name }}.{{ item.type }}"
      when: (item.state | default('present')) == 'absent'
      notify: Reload the user manager

    # The product owns two files beside a unit; withdrawing the unit must not
    # leave them active as an orphan drop-in.
    - name: The product's per-unit drop-ins go with the unit they bound
      ansible.builtin.file:
        path: "{{ quadlet_directory }}/{{ item.0.name }}.{{ item.0.type }}.d/{{ item.1 }}"
        state: absent
      loop: "{{ quadlet_units | product(['50-default-memory.conf', '51-default-cpu.conf']) | list }}"
      loop_control:
        label: "{{ item.0.name }}.{{ item.0.type }}.d/{{ item.1 }}"
      when:
        - (item.0.state | default('present')) == 'absent'
        - (item.0.type | default('')) == 'container'
      notify: Reload the user manager

    # The generated units exist only after a reload, and the handler runs at the
    # end of the play: flush it before the read-back, not after.
    - name: The user manager is reloaded before the read-back
      ansible.builtin.meta: flush_handlers

    - name: The generated units are read back
      ansible.builtin.command:  # noqa: command-instead-of-module
        argv:
          - systemctl
          - --user
          - cat
          - "{{ item.name }}{{ quadlet_suffixes[item.type] }}.service"
      become: true
      become_user: "{{ quadlet_user }}"
      environment:
        HOME: "{{ quadlet_home }}"
        USER: "{{ quadlet_user }}"
        LOGNAME: "{{ quadlet_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ quadlet_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ quadlet_uid }}/bus"
      loop: "{{ quadlet_units }}"
      loop_control:
        label: "{{ item.name }}.{{ item.type }}"
      register: quadlet_unit_readback
      changed_when: false
      failed_when: false
      when:
        - quadlet_verify | bool
        - not ansible_check_mode
        - (item.state | default('present')) == 'present'

    - name: The user manager knows every declared unit
      ansible.builtin.assert:
        that:
          - >-
            quadlet_unit_readback.results | default([])
            | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
            | list | length == 0
        fail_msg: >-
          A declared unit is not generated: check that the file is a valid
          Quadlet declaration and that the account's user manager runs.
        quiet: true
      when:
        - quadlet_verify | bool
        - not ansible_check_mode
