---
- name: The account is configured
  when: account_enabled | bool
  block:
    - name: The declared identity is checked against the host
      ansible.builtin.include_tasks: validate.yml

    - name: The owning group exists with the declared GID
      ansible.builtin.group:
        name: "{{ account_name }}"
        gid: "{{ account_gid | int }}"
        state: present

    - name: The owning account exists with the declared identity
      ansible.builtin.user:
        name: "{{ account_name }}"
        uid: "{{ account_uid | int }}"
        group: "{{ account_name }}"
        home: "{{ account_home | default(omit, true) }}"
        shell: "{{ account_shell }}"
        comment: "{{ account_comment }}"
        create_home: "{{ account_create_home | bool }}"
        password_lock: true
        state: present

    - name: The account is read back
      ansible.builtin.include_tasks: read-back.yml
