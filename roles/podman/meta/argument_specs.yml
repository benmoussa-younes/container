---
argument_specs:
  main:
    short_description: The optional rootless Podman engine.
    description:
      - >-
        Installs Podman and configures a rootless engine for one existing human
        account: packages, registry search path, user socket, linger and
        subordinate IDs. It does not create, start or manage a container; a
        service a site runs stays the site's. The rootful socket is not enabled.
    author: Younes BENMOUSSA
    options:
      podman_enabled:
        type: bool
        required: false
        description: Whether the engine is selected. False installs nothing.
      container_host_edition:
        type: str
        required: false
        choices: [server]
        description: >-
          The edition the host already carries. The collection owns no identity
          and writes none; it installs on an edition it does not choose, and it
          refuses any value outside this list. `server` is the only edition it
          supports today.
      podman_user:
        type: str
        required: false
        description: The existing account that owns the rootless engine. Never root.
      podman_packages:
        type: list
        elements: str
        required: false
        description: The Debian packages the engine needs.
      podman_registries:
        type: list
        elements: str
        required: false
        description: The registries an unqualified image name searches.
      podman_registries_dir:
        type: str
        required: false
        description: The registries.conf.d directory.
      podman_registries_file:
        type: str
        required: false
        description: The drop-in that declares the registry search path.
      podman_containers_dir:
        type: str
        required: false
        description: The containers.conf.d directory.
      podman_containers_file:
        type: str
        required: false
        description: The drop-in that declares the engine settings.
      podman_stale_config_files:
        type: list
        elements: str
        required: false
        description: >-
          The drop-ins the retired edition roles wrote and this role removes
          before writing its own, so exactly one file owns each configuration.
          Defaults to `99-podman.conf` under both configuration directories.
      podman_no_new_privileges:
        type: bool
        required: false
        description: >-
          Whether every container of the engine runs with `no_new_privileges`.
          True overrides the `containers.conf` default, which is false.
      podman_pids_limit:
        type: int
        required: false
        description: The process limit of a container when the unit declares none.
      podman_log_size_max:
        type: int
        required: false
        description: >-
          The maximum size of a container log in bytes. Negative means no limit,
          which is the `containers.conf` default.
      podman_umask:
        type: str
        required: false
        description: The umask inside a container.
      podman_runtime:
        type: str
        required: false
        description: The OCI runtime the engine uses.
      podman_socket_enabled:
        type: bool
        required: false
        description: Whether the rootless user socket is enabled.
      podman_linger:
        type: bool
        required: false
        description: Whether the user manager runs without an active login.
      podman_userns_sysctl:
        type: str
        required: false
        description: >-
          The drop-in that re-enables unprivileged user namespaces for a host
          that declares the engine. It loads after the edition's hardening file.
      podman_subuid_start:
        type: int
        required: false
        description: >-
          The first subordinate UID/GID block the plan may use. The plan walks
          `podman_subuid_start + k * podman_subuid_count` until a block is free
          in both files.
      podman_subuid_count:
        type: int
        required: false
        description: The number of subordinate UIDs and GIDs the account needs.
      podman_subuid_file:
        type: str
        required: false
        description: >-
          The subordinate UID file the plan reads. `usermod` always writes the
          system `/etc/subuid`, so this variable relocates the read, not the
          write: it serves a fixture, never a second engine file.
      podman_subgid_file:
        type: str
        required: false
        description: >-
          The subordinate GID file the plan reads. `usermod` always writes the
          system `/etc/subgid`, as `podman_subuid_file` explains.
      podman_subid_passwd_file:
        type: str
        required: false
        description: >-
          The account file the plan reads: a candidate block may not contain a
          UID this file declares, or the block would map that account's own UID
          into every container.
      podman_subid_group_file:
        type: str
        required: false
        description: The group file the plan reads, with the same rule as `podman_subid_passwd_file`.
      podman_subid_nsswitch_file:
        type: str
        required: false
        description: >-
          The name-service file the plan reads to refuse a host that delegates
          subordinate IDs to an NSS provider, which the plan cannot see.
      podman_subuid_repair:
        type: bool
        required: false
        description: >-
          Whether the role may remove this account's unusable ranges and add the
          free block the plan names. False fails the run instead, so a host the
          product does not own keeps its identifiers untouched.
      podman_system_migrate:
        type: bool
        required: false
        description: >-
          Whether `podman system migrate` runs as the owning account after the
          ranges change, so its pause process adopts the new mapping.
      podman_verify:
        type: bool
        required: false
        description: Whether the role reads the engine back after configuring it.
