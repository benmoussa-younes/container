---
# The rootless Podman engine. No container is created or started here.
#
# The edition guard sits outside the `podman_enabled` block on purpose:
# applying this role to a host declares that the host carries a supported
# edition, and a site that forgets the value must fail whether or not the
# engine is selected.
- name: The host edition this collection installs on is declared
  ansible.builtin.assert:
    that:
      - container_host_edition | default('') | length > 0
    fail_msg: >-
      container_host_edition is not declared. benmoussa.container owns no
      identity and installs on the edition the host already carries:
      declare `container_host_edition: server` in the host's variables.
    quiet: true

# `podman info` and `podman unshare` need the account's runtime directory,
# which exists only while its user manager runs: a read-back without linger
# fails on a host that was configured correctly.
- name: The engine's read-back needs the account's user manager
  ansible.builtin.assert:
    that:
      - not (podman_verify | bool) or (podman_linger | bool)
    fail_msg: >-
      podman_verify requires podman_linger: `podman info` and
      `podman unshare` run as the account and need `/run/user/<uid>`, which
      exists only while its user manager runs. Set `podman_linger: true`, or
      set `podman_verify: false` and read the engine yourself.
    quiet: true

# The role names Debian paths, Debian packages and a Debian kernel setting, so
# it refuses another base before it writes anything.
#
# The base release is read from `/etc/debian_version`, not from
# `ansible_distribution_major_version`: an edition brands `/etc/os-release`
# (the Workstation Edition declares its own), and the version fact would read that
# branding instead of the release both editions keep as Debian (measured on a
# Debian 13 host whose edition brands it: `/etc/debian_version` = 13.7).
- name: The base release is read
  ansible.builtin.slurp:
    src: /etc/debian_version
  register: podman_debian_version
  check_mode: false
  failed_when: false

- name: The cgroup hierarchy is read
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: stat -fc %T /sys/fs/cgroup
  register: podman_cgroup_type
  changed_when: false
  check_mode: false
  failed_when: false

# Quadlet needs cgroup v2, and rootless Podman needs a user namespace. Both are
# read here rather than discovered later as a container that never starts.
- name: The host carries the base this collection supports
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.service_mgr == 'systemd'
      - (podman_debian_version.content | default('') | b64decode | trim).split('.')[0] == '13'
      - podman_cgroup_type.stdout | default('') | trim == 'cgroup2fs'
    fail_msg: >-
      {{ inventory_hostname }} is not a Debian 13 host with systemd and cgroup
      v2 ({{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }}, {{ ansible_facts.service_mgr }},
      cgroup {{ podman_cgroup_type.stdout | default('?') | trim }}). The
      engine's paths, its packages, the unprivileged user namespace setting and
      the Quadlet generator are Debian's.
    quiet: true

- name: The rootless Podman engine is configured
  when: podman_enabled | bool
  block:
    - name: The owning account is declared
      ansible.builtin.assert:
        that:
          - podman_user | length > 0
          - podman_user != 'root'
        fail_msg: >-
          podman_user must name a non-root account. `roles/account` creates
          {{ account_name | default('container') }} (uid/gid 1500) by default;
          run it first, or declare podman_user and account_name for the account
          you own. This role never configures the rootful engine.

    - name: The owning account is read
      ansible.builtin.getent:
        database: passwd
        key: "{{ podman_user }}"

    - name: The owning account exists
      ansible.builtin.assert:
        that:
          - podman_user in ansible_facts.getent_passwd
        fail_msg: >-
          {{ podman_user }} does not exist on this host. `roles/account` creates
          it (account_enabled: true); run it first, or declare podman_user for
          an account that exists.

    - name: The owning account's UID and home are known
      ansible.builtin.set_fact:
        podman_uid: "{{ ansible_facts.getent_passwd[podman_user][1] }}"
        podman_home: "{{ ansible_facts.getent_passwd[podman_user][4] }}"

    # Linger comes before anything that runs as the account: `podman system
    # migrate` and `podman unshare` need `XDG_RUNTIME_DIR` (`/run/user/<uid>`),
    # which exists only while the account's user manager runs. A host without
    # `pam_systemd` in the `sudo` stack does not create it on `become`, so the
    # role starts the manager itself and waits for the directory (measured on
    # a Debian 13 host: the commands fail with `lstat … no such file or directory`
    # until `/run/user/<uid>` exists).
    - name: The user manager may run without a login
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: "loginctl enable-linger {{ podman_user }}"
        creates: "/var/lib/systemd/linger/{{ podman_user }}"
      when: podman_linger | bool and not ansible_check_mode

    - name: The account's runtime directory exists
      ansible.builtin.wait_for:
        path: "/run/user/{{ podman_uid }}"
        timeout: 30
      when: podman_linger | bool and not ansible_check_mode

    - name: The engine packages are present
      ansible.builtin.apt:
        name: "{{ podman_packages }}"
        state: present
        cache_valid_time: 3600

    - name: The container configuration directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ podman_registries_dir }}"
        - "{{ podman_containers_dir }}"
        # The sysctl drop-in may be relocated (a sandbox keeps it under /var/tmp);
        # its parent is not one of the engine's directories, so it is created
        # here rather than assumed.
        - "{{ podman_userns_sysctl | dirname }}"

    - name: The user namespace setting rootless Podman needs is declared
      ansible.builtin.copy:
        content: |
          # Managed by Ansible; do not edit.
          # SPDX-License-Identifier: AGPL-3.0-or-later
          #
          # Rootless Podman clones an unprivileged user namespace for every
          # container. A hardened host disables them; this file loads after that
          # file and re-enables them on a host that declares the engine.
          kernel.unprivileged_userns_clone = 1
        dest: "{{ podman_userns_sysctl }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload sysctl

    - name: The sysctl handler runs before the engine is read back
      ansible.builtin.meta: flush_handlers

    # Read even under `--check`: the command only reads, and the value is what
    # the assert names when it fails.
    - name: The unprivileged user namespace setting is read
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: /usr/sbin/sysctl -n kernel.unprivileged_userns_clone
      register: podman_userns_value
      changed_when: false
      check_mode: false

    # Skipped under `--check`: the drop-in is not applied there, so the running
    # value says nothing about the host a real run would leave behind.
    - name: Unprivileged user namespaces are enabled for the engine
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - podman_userns_value.stdout | trim == '1'
        fail_msg: >-
          {{ inventory_hostname }}: kernel.unprivileged_userns_clone is
          {{ podman_userns_value.stdout | trim }}, not 1, so rootless Podman
          cannot clone its namespace. Check {{ podman_userns_sysctl }} and run
          `/usr/sbin/sysctl --system`.

    # Tagged (here and on the task in `stale.yml`, because a tag on an include
    # is not inherited) so a fixture can reach the removal with
    # `--tags registries --check`. A real tag-only run is not supported: the
    # notified handler needs the account facts that the full role gathers.
    - name: The drop-ins the retired edition roles wrote are removed
      ansible.builtin.include_tasks: stale.yml
      tags: [registries]

    - name: The registry search path is declared
      ansible.builtin.template:
        src: registries.conf.j2
        dest: "{{ podman_registries_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart the rootless Podman socket

    - name: The rootless engine settings are declared
      ansible.builtin.template:
        src: containers.conf.j2
        dest: "{{ podman_containers_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart the rootless Podman socket

    - name: The subordinate ID ranges are planned before they are written
      ansible.builtin.include_tasks: subuid.yml

    - name: The user socket has a running user manager
      ansible.builtin.assert:
        that:
          - not (podman_socket_enabled | bool) or (podman_linger | bool)
        fail_msg: >-
          podman_socket_enabled requires podman_linger, so the account's user
          manager exists without an active login.

    - name: The rootless Podman socket is enabled
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: systemctl --user enable --now podman.socket
      become: true
      become_user: "{{ podman_user }}"
      environment:
        HOME: "{{ podman_home }}"
        USER: "{{ podman_user }}"
        LOGNAME: "{{ podman_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_uid }}/bus"
      register: podman_socket_enable
      changed_when: >-
        'Created symlink' in podman_socket_enable.stdout
        or 'Created symlink' in podman_socket_enable.stderr
      retries: 5
      delay: 2
      until: podman_socket_enable.rc == 0
      when: podman_socket_enabled | bool and not ansible_check_mode

    - name: The rootless engine is read back
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: podman info --format json
      become: true
      become_user: "{{ podman_user }}"
      environment:
        HOME: "{{ podman_home }}"
        USER: "{{ podman_user }}"
        LOGNAME: "{{ podman_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_uid }}/bus"
      register: podman_info
      changed_when: false
      when: podman_verify | bool and not ansible_check_mode

    - name: The engine is the product's
      ansible.builtin.assert:
        that:
          - (podman_info.stdout | from_json).host.security.rootless | bool
          - (podman_info.stdout | from_json).host.cgroupVersion == 'v2'
          - (podman_info.stdout | from_json).host.networkBackend == 'netavark'
          - (podman_info.stdout | from_json).store.graphDriverName != 'vfs'
        fail_msg: >-
          podman info for {{ podman_user }} does not report a rootless engine on
          cgroup v2 with the netavark backend and a store other than vfs:
          {{ podman_info.stdout }}.
      when: podman_verify | bool and not ansible_check_mode

    - name: The rootless socket is active
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: systemctl --user is-active podman.socket
      become: true
      become_user: "{{ podman_user }}"
      environment:
        HOME: "{{ podman_home }}"
        USER: "{{ podman_user }}"
        LOGNAME: "{{ podman_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_uid }}/bus"
      register: podman_socket_state
      changed_when: false
      failed_when: false
      when: podman_socket_enabled | bool and not ansible_check_mode

    - name: The rootless socket is running
      ansible.builtin.assert:
        that:
          - podman_socket_state.stdout | trim == 'active'
        fail_msg: "podman.socket is not active for {{ podman_user }}."
      when: podman_socket_enabled | bool and not ansible_check_mode

    - name: The auto-update timer needs the account's user manager
      ansible.builtin.assert:
        that:
          - not (podman_auto_update | bool) or (podman_linger | bool)
        fail_msg: >-
          podman_auto_update requires podman_linger: the timer runs in the
          account's user manager, which exists without a login only while the
          account lingers.
        quiet: true

    - name: The auto-update timer is enabled
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: systemctl --user enable --now podman-auto-update.timer
      become: true
      become_user: "{{ podman_user }}"
      environment:
        HOME: "{{ podman_home }}"
        USER: "{{ podman_user }}"
        LOGNAME: "{{ podman_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_uid }}/bus"
      register: podman_auto_update_enable
      changed_when: >-
        'Created symlink' in podman_auto_update_enable.stdout
        or 'Created symlink' in podman_auto_update_enable.stderr
      retries: 5
      delay: 2
      until: podman_auto_update_enable.rc == 0
      when: podman_auto_update | bool and not ansible_check_mode

    - name: The auto-update timer is active
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: systemctl --user is-active podman-auto-update.timer
      become: true
      become_user: "{{ podman_user }}"
      environment:
        HOME: "{{ podman_home }}"
        USER: "{{ podman_user }}"
        LOGNAME: "{{ podman_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_uid }}/bus"
      register: podman_auto_update_state
      changed_when: false
      failed_when: false
      when: podman_auto_update | bool and not ansible_check_mode

    - name: The auto-update timer runs
      ansible.builtin.assert:
        that:
          - podman_auto_update_state.stdout | trim == 'active'
        fail_msg: "podman-auto-update.timer is not active for {{ podman_user }}."
      when: podman_auto_update | bool and not ansible_check_mode

    - name: The user manager lingers
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: "loginctl show-user {{ podman_user }} -p Linger"
      register: podman_linger_state
      changed_when: false
      when: podman_linger | bool and not ansible_check_mode

    - name: The user manager is allowed to linger
      ansible.builtin.assert:
        that:
          - podman_linger_state.stdout | trim == 'Linger=yes'
        fail_msg: "Linger is not enabled for {{ podman_user }}."
      when: podman_linger | bool and not ansible_check_mode

- name: The engine's user namespace drop-in is removed when the engine is not declared
  ansible.builtin.file:
    path: "{{ podman_userns_sysctl }}"
    state: absent
  when: not (podman_enabled | bool)
  notify: Reload sysctl
