---
# The rootless Podman engine.
#
# This role installs and configures the engine, never a container: a service a
# site runs is the site's, not the base machine's. The human account owns the
# rootless engine; the rootful socket is not enabled.
podman_enabled: false

# The edition the host already carries. This collection owns no identity: it
# installs on an edition, never chooses or writes one. The variable has no
# entry here on purpose — a declared value is validated against the `choices`
# of `meta/argument_specs.yml` (`server` today), and an absent one fails the
# role's first task with a message that says what to declare.

podman_user: "{{ account_name | default('container') }}"

podman_packages:
  - podman
  - crun             # the runtime the engine settings name
  - slirp4netns
  - fuse-overlayfs
  - uidmap
  - passt
  # `RunInit=true` is in the Quadlet default drop-in, and Podman's init binary is
  # `catatonit`. Debian lists it as a *Recommends* of `podman`, so a host that
  # installs no recommends starts no container at all.
  - catatonit

# The registries an unqualified image name searches.
podman_registries:
  - docker.io

# Rootless Podman clones an unprivileged user namespace for every container, and
# a hardened host disables them (`60-hardening.conf` in the Server collection).
# This drop-in loads after that file and re-enables the setting on a host that
# declares the engine; the role removes it when the engine is not declared.
podman_userns_sysctl: /etc/sysctl.d/62-podman-userns.conf

podman_registries_dir: /etc/containers/registries.conf.d
podman_registries_file: "{{ podman_registries_dir }}/99-container-podman.conf"
podman_containers_dir: /etc/containers/containers.conf.d
podman_containers_file: "{{ podman_containers_dir }}/99-container-podman.conf"

# The drop-ins the retired edition roles wrote under these directories. Two
# writers of the same file means the last one wins, and the lexical order of
# `99-*.conf` makes the old name win, so this role removes them before it
# writes its own. The list follows the directories above, so a site that
# relocates them for a fixture relocates the removal too.
podman_stale_config_files:
  - "{{ podman_registries_dir }}/99-podman.conf"
  - "{{ podman_containers_dir }}/99-podman.conf"

podman_no_new_privileges: true
podman_pids_limit: 512
podman_log_size_max: 10485760
podman_umask: "0077"
podman_runtime: crun

# The user socket and the user manager that keeps it alive without a login.
podman_socket_enabled: true
podman_linger: true

# The subordinate ID files, and the decision a broken state leads to.
#
# A rootless engine maps the container's UIDs onto these ranges, and podman's
# rootless tutorial states the rule: the ranges of two accounts must not overlap,
# or one account can use another's namespace and corrupt it. The role computes
# the plan over both files (`files/subid-plan.awk`) and refuses a state it would
# have to guess at: a range that overlaps another account, a range shorter than
# `podman_subuid_count`, a range in one file only, or two ranges in one file.
# `podman_subuid_repair: true` removes *this account's* unusable ranges and adds
# the first free block at or after `podman_subuid_start`; it never touches
# another account's line.
podman_subuid_file: /etc/subuid
podman_subgid_file: /etc/subgid
# shadow-utils 4.9 can delegate subordinate IDs to an NSS provider
# (`subid: sss`). The plan reads the files, so it refuses such a host instead of
# reporting a range it cannot see.
podman_subid_nsswitch_file: /etc/nsswitch.conf
# The block must not contain an identifier a host account already holds: on a
# host whose accounts start above 100000, a subordinate block would map that
# account's own UID into every container. The plan reads both files and skips a
# block that contains one.
podman_subid_passwd_file: /etc/passwd
podman_subid_group_file: /etc/group
podman_subuid_repair: false

# When the plan changes the ranges, the account's pause process still holds the
# old mapping until `podman system migrate` runs as that account. Podman's
# tutorial names that command, not a service restart, as the way to adopt a new
# one.
podman_system_migrate: true

# The first subordinate ID block the plan may use, and the size it must have.
# The plan walks `podman_subuid_start + k * podman_subuid_count` until a block is
# free in both files, so two engines on one host never collide.
podman_subuid_start: 100000
podman_subuid_count: 65536

# The verification runs `podman info` as the owning account.
podman_verify: true
