---
- name: The rootless container engine
  hosts: "{{ target | default('all') }}"
  become: true
  roles:
    - role: account
      tags: [account]
      when:
        - account_enabled | default(true) | bool
        - (podman_enabled | default(false) | bool) or (quadlet_enabled | default(false) | bool)
    - role: podman
      tags: [podman]
    - role: quadlet
      tags: [quadlet]
