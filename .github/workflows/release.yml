---
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the Scripts interpreter
        run: |
          curl -fsSL -o /tmp/scripts.tar.gz \
            https://github.com/benmoussa-younes/scripts/releases/download/v0.3.0/scripts_0.3.0_linux-x64.tar.gz
          echo "ceb83ff59e226644d0b12dbebbfe751145e36118175e055c5e1eead9adb0c7a8  /tmp/scripts.tar.gz" | sha256sum -c -
          tar -xzf /tmp/scripts.tar.gz -C /tmp
          sudo install /tmp/scripts-0.3.0/scripts /usr/local/bin/scripts
          scripts --version

      - name: Install Ansible and the linters
        run: |
          pipx install "ansible-core==2.21.*"
          pipx install "ansible-lint==26.11.0"
          pipx install "yamllint==1.37.1"
          pipx install "reuse==6.3.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify the tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ref="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")"
          type="$(printf '%s' "$ref" | jq -r '.object.type')"
          object="$(printf '%s' "$ref" | jq -r '.object.sha')"
          test "$type" = "tag"
          verified="$(gh api "repos/$GH_REPO/git/tags/$object" --jq '.verification.verified')"
          test "$verified" = "true"

      - name: Prepare the collection path for ansible-test
        run: |
          mkdir -p /tmp/ansible_collections/benmoussa
          cp -a "$GITHUB_WORKSPACE" /tmp/ansible_collections/benmoussa/container
          rm -rf /tmp/ansible_collections/benmoussa/container/.git \
                 /tmp/ansible_collections/benmoussa/container/dist \
                 /tmp/ansible_collections/benmoussa/container/.ansible

      - name: Ansible sanity tests
        working-directory: /tmp/ansible_collections/benmoussa/container
        run: ansible-test sanity --python 3.13

      - name: Ansible lint on the whole repository
        run: ansible-lint

      - name: Check the repository scripts
        run: |
          scripts check --deny-warnings tools/scripts/binaries/gate.scs
          scripts check --deny-warnings tools/scripts/binaries/release.scs
          scripts check --deny-warnings tools/scripts/binaries/verify-release.scs
          scripts check --module --deny-warnings tools/scripts/modules/repo.scs
          scripts check --module --deny-warnings tools/scripts/modules/secrets.scs
          scripts check --module --deny-warnings tools/scripts/modules/verdict.scs

      - name: Gate
        run: scripts run --no-warnings tools/scripts/binaries/gate.scs

      - name: Verify tag matches VERSION
        run: test "$(cat VERSION)" = "${TAG#v}"

      - name: Build release assets
        run: scripts run tools/scripts/binaries/release.scs --ci

      - name: Verify release assets
        run: scripts run tools/scripts/binaries/verify-release.scs

      # The tag is signed by the maintainer, but its signature covers the commit
      # and not the bytes of the two archives built here. The attestation binds
      # the archives named in SHA256SUMS to this workflow run and repository;
      # verify it with `gh attestation verify <asset> --repo <repo>`.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz

      - name: Extract the changelog section
        run: |
          version="$(cat VERSION)"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            dist/*
            release-notes.md
            VERSION

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        # The artifact keeps the paths it was uploaded with: `dist/*` and
        # `release-notes.md` land relative to the workspace root. Downloading
        # into `dist/` nested them again (`dist/dist`), which `gh release
        # create` cannot upload -- measured on the workstation release,
        # 2026-11-18. Fixed here before the first tag.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(cat VERSION)"
          collection="dist/benmoussa-container-${version}.tar.gz"
          source="dist/container-${version}-src.tar.gz"
          checksums="dist/SHA256SUMS"
          for asset in "$collection" "$source" "$checksums"; do
            test -f "$asset" || { echo "missing $asset" >&2; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$collection" "$source" "$checksums" --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "Container ${TAG}" \
              --notes-file release-notes.md \
              "$collection" "$source" "$checksums"
          fi

          gh release edit "$TAG" --draft=false
