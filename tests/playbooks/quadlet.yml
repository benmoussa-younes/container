---
# Proves the `quadlet` role's decisions without root.
#
# The role writes into a directory the owning account owns, so the play runs as
# the current account with `quadlet_verify: false` (no user manager) and
# `quadlet_reload: false` (no `systemctl --user daemon-reload`). Every case that
# must be refused catches the failure and reads the message that carried it: a
# `fail` inside the block would be caught by the same `rescue` and prove nothing.
- name: Declared keys are matched whatever the spacing around the equal sign
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    quadlet_enabled: true
    quadlet_user: "{{ lookup('env', 'USER') }}"
    quadlet_reload: false
    quadlet_verify: false
    quadlet_directory: /tmp/opencode/quadlet-proof/spacing
    quadlet_hardened_defaults: true
    quadlet_units:
      - name: relaxed
        type: container
        content: |
          [Container]
          Image=docker.io/library/alpine:3.20
          Network = host

          [Install]
          WantedBy=default.target
  tasks:
    - name: The unit with a spaced forbidden key fails the run
      block:
        - name: The declarations are applied
          ansible.builtin.include_role:
            name: quadlet
            tasks_from: main.yml

        - name: The refusal is missing
          ansible.builtin.fail:
            msg: "VACUOUS: a forbidden key written as `Network = host` was accepted"
      rescue:
        # A looped `assert` reports "One or more items failed" and carries the
        # real reason in each item's `msg`, so both shapes are read.
        - name: The refusal is read
          ansible.builtin.set_fact:
            quadlet_refusal: >-
              {{ (ansible_failed_result.results | default([])
                  | map(attribute='msg') | list
                  + [ansible_failed_result.msg | default('')]) | join(' ') }}

    - name: The run failed on the forbidden key, not on something else
      ansible.builtin.assert:
        that:
          - "'VACUOUS' not in quadlet_refusal"
          - "'Network=host' in quadlet_refusal"
        fail_msg: "{{ quadlet_refusal | default('the include did not fail') }}"

- name: A container unit without a boot contract is refused
