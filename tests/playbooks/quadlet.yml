- name: A high port and a template name are accepted and written
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    quadlet_enabled: true
    quadlet_user: "{{ lookup('env', 'USER') }}"
    quadlet_reload: false
    quadlet_verify: false
    quadlet_directory: /tmp/opencode/quadlet-proof/port-template
    quadlet_hardened_defaults: true
    quadlet_unprivileged_port_start: 1024
    quadlet_units:
      - name: highport
        type: container
        content: |
          [Container]
          Image=docker.io/library/alpine:3.20
          PublishPort=8443:443

          [Install]
          WantedBy=default.target
      - name: probe@
        type: container
        content: |
          [Container]
          Image=docker.io/library/alpine:3.20

          [Install]
          WantedBy=default.target
          DefaultInstance=probe
  tasks:
    - name: The declarations are applied
      ansible.builtin.include_role:
        name: quadlet
        tasks_from: main.yml

    - name: The template unit is read
      ansible.builtin.stat:
        path: "{{ quadlet_directory }}/probe@.container"
      register: quadlet_template_unit

    - name: The high port is read
      ansible.builtin.slurp:
        src: "{{ quadlet_directory }}/highport.container"
      register: quadlet_high_port

    - name: The template name and the high port are accepted
      ansible.builtin.assert:
        that:
          - quadlet_template_unit.stat.isreg | default(false)
          - "'PublishPort=8443:443' in (quadlet_high_port.content | b64decode)"

