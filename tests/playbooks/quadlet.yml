    quadlet_enabled: true
    quadlet_user: "{{ lookup('env', 'USER') }}"
    quadlet_reload: false
    quadlet_verify: false
    quadlet_directory: /tmp/opencode/quadlet-proof/no-install
    quadlet_units:
      - name: noboot
        type: container
        content: |
          [Container]
          Image=docker.io/library/alpine:3.20
  tasks:
    - name: The unit without [Install] fails the run
      block:
        - name: The declarations are applied
          ansible.builtin.include_role:
            name: quadlet
            tasks_from: main.yml

        - name: The refusal is missing
          ansible.builtin.fail:
            msg: "VACUOUS: a container unit without `[Install]` was accepted"
      rescue:
        # A looped `assert` reports "One or more items failed" and carries the
        # real reason in each item's `msg`, so both shapes are read.
        - name: The refusal is read
          ansible.builtin.set_fact:
            quadlet_refusal: >-
              {{ (ansible_failed_result.results | default([])
                  | map(attribute='msg') | list
                  + [ansible_failed_result.msg | default('')]) | join(' ') }}

    - name: The run failed on the boot contract, not on something else
      ansible.builtin.assert:
        that:
          - "'VACUOUS' not in quadlet_refusal"
          - "'WantedBy' in quadlet_refusal"
        fail_msg: "{{ quadlet_refusal | default('the include did not fail') }}"

- name: A unit that opts out of the boot contract is accepted
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    quadlet_enabled: true
    quadlet_user: "{{ lookup('env', 'USER') }}"
    quadlet_reload: false
    quadlet_verify: false
    quadlet_directory: /tmp/opencode/quadlet-proof/boot-false
    quadlet_units:
      - name: manual
        type: container
        boot: false
        content: |
          [Container]
          Image=docker.io/library/alpine:3.20
  tasks:
    - name: The declarations are applied
      ansible.builtin.include_role:
        name: quadlet
        tasks_from: main.yml

    - name: The opt-out unit is written
      ansible.builtin.stat:
        path: /tmp/opencode/quadlet-proof/boot-false/manual.container
      register: quadlet_written

    - name: The unit exists
      ansible.builtin.assert:
        that:
          - quadlet_written.stat.exists

