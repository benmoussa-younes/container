---
# Proves the engine defaults the `podman` role writes, without root and without
# Podman: the two templates are rendered with the role's own defaults, loaded
# from `defaults/main.yml`, and the values a product decides are asserted one by
# one. A deleted line in a template fails here; the gate would otherwise stay
# green, because nothing else reads them.
- name: The engine defaults are the product's
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    container_host_edition: server
    podman_proof: /tmp/opencode/podman-proof
  tasks:
    - name: The role's defaults are loaded as play variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/podman/defaults/main.yml"

    - name: The proof directory exists
      ansible.builtin.file:
        path: "{{ podman_proof }}"
        state: directory
        mode: "0755"

    - name: The two templates are rendered where the host would read them
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/podman/templates/{{ item }}"
        dest: "{{ podman_proof }}/{{ item | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop:
        - containers.conf.j2
        - registries.conf.j2

    - name: The rendered files are read
      ansible.builtin.slurp:
        src: "{{ podman_proof }}/{{ item }}"
      loop:
        - containers.conf
        - registries.conf
      register: podman_proof_files

    - name: The engine and container settings are the product's
      ansible.builtin.assert:
        that:
          - podman_rendered_engine is search('(?m)^cgroup_manager = "systemd"$')
          - podman_rendered_engine is search('(?m)^events_logger = "journald"$')
          - podman_rendered_engine is search('(?m)^runtime = "crun"$')
          - podman_rendered_engine is search('(?m)^no_new_privileges = true$')
          - podman_rendered_engine is search('(?m)^pids_limit = 512$')
          - podman_rendered_engine is search('(?m)^log_size_max = 10485760$')
          - podman_rendered_engine is search('(?m)^umask = "0077"$')
        fail_msg: "{{ podman_rendered_engine }}"
      vars:
        podman_rendered_engine: "{{ podman_proof_files.results[0].content | b64decode }}"

    - name: The registry search path is the product's
      ansible.builtin.assert:
        that:
          - podman_rendered_registries is search('(?m)^unqualified-search-registries = \["docker.io"\]$')
        fail_msg: "{{ podman_rendered_registries }}"
      # `include_vars` outranks task vars, so the rendered text is never named
      # after a role variable: `podman_registries` would still be the list.
      vars:
        podman_rendered_registries: "{{ podman_proof_files.results[1].content | b64decode }}"
