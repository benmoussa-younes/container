---
- name: An empty account name is refused
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    account_name: ""
    account_uid: 1500
    account_gid: 1500
  tasks:
    - name: The empty name fails the run
      block:
        - name: The declared identity is checked
          ansible.builtin.include_role:
            name: account
            tasks_from: validate.yml

        - name: The refusal is missing
          ansible.builtin.fail:
            msg: "VACUOUS: an empty account name was accepted"
      rescue:
        - name: The refusal is read
          ansible.builtin.set_fact:
            account_refusal: "{{ ansible_failed_result.msg | default('') }}"

    - name: The run failed on the name, not on something else
      ansible.builtin.assert:
        that:
          - "'VACUOUS' not in account_refusal"
          - "'portable lowercase login name' in account_refusal"
        fail_msg: "{{ account_refusal | default('the include did not fail') }}"

- name: The root account is refused
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    account_name: root
    account_uid: 1500
    account_gid: 1500
  tasks:
    - name: The root name fails the run
      block:
        - name: The declared identity is checked
          ansible.builtin.include_role:
            name: account
            tasks_from: validate.yml

        - name: The refusal is missing
          ansible.builtin.fail:
            msg: "VACUOUS: root was accepted as the engine's account"
      rescue:
        - name: The refusal is read
          ansible.builtin.set_fact:
            account_refusal: "{{ ansible_failed_result.msg | default('') }}"

    - name: The run failed on the name, not on something else
      ansible.builtin.assert:
        that:
          - "'VACUOUS' not in account_refusal"
          - "'never root' in account_refusal"
        fail_msg: "{{ account_refusal | default('the include did not fail') }}"

