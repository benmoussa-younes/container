---
# A disposable converge of this collection on the host that runs the tests.
#
# The engine's three configuration files are relocated under
# `/var/tmp/container-sandbox`, so the host's real rootless engine keeps its own
# `/etc/containers` untouched. The host-level changes
# are the engine packages (usually already installed), the sandbox
# account's own identifiers (`/etc/subuid`, `/etc/subgid`), its linger file, its
# user socket and the container storage its engine creates under its home.
#
# The account is created by the owner, not by this inventory:
#
#   sudo useradd --create-home --shell /usr/sbin/nologin ctr-sandbox
#
# then, from the repository root:
#
#   scripts run tools/scripts/binaries/verify-sandbox.scs
#
# and to leave the machine as it was:
#
#   sudo loginctl disable-linger ctr-sandbox
#   sudo userdel --remove ctr-sandbox
#   rm -rf /var/tmp/container-sandbox
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3
  children:
    sandbox:
      hosts:
        test-host:
          ansible_host: localhost
      vars:
        # The collection reads the edition and refuses an unknown one. The
        # sandbox runs the `server` code path: it is the code path the product
        # ships today, and the edition of the host is the host's business.
        container_host_edition: server

        podman_enabled: true
        podman_user: ctr-sandbox
        podman_verify: true
        podman_subuid_repair: true

        # Everything the role writes outside the account lives here.
        podman_sandbox: /var/tmp/container-sandbox
        podman_registries_dir: "{{ podman_sandbox }}/registries.conf.d"
        podman_containers_dir: "{{ podman_sandbox }}/containers.conf.d"
        podman_registries_file: "{{ podman_registries_dir }}/99-container-podman.conf"
        podman_containers_file: "{{ podman_containers_dir }}/99-container-podman.conf"
        podman_userns_sysctl: "{{ podman_sandbox }}/sysctl.d/62-podman-userns.conf"

        # No unit: the sandbox proves the engine and the identifiers. A unit
        # would need an image, and pulling one is the site's decision.
        quadlet_enabled: false
