---
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: /usr/bin/python3
  children:
    sandbox:
      hosts:
        test-host:
          ansible_host: localhost
      vars:
        container_host_edition: server

        account_enabled: true
        account_name: ctr-sandbox
        account_uid: 1650
        account_gid: 1650
        account_shell: /bin/bash

        podman_enabled: true
        podman_verify: true
        podman_auto_update: true
        podman_subuid_repair: true

        podman_sandbox: /var/tmp/container-sandbox
        podman_legacy_registries_dir: "{{ podman_sandbox }}/registries.conf.d"
        podman_legacy_containers_dir: "{{ podman_sandbox }}/containers.conf.d"
        podman_userns_sysctl: "{{ podman_sandbox }}/sysctl.d/62-podman-userns.conf"

        quadlet_enabled: true
        quadlet_units:
          - name: sandbox-state
            type: volume
            content: |
              [Volume]
              VolumeName=container-sandbox-state

              [Install]
              WantedBy=default.target
            dropins:
              - name: 50-copy.conf
                content: |
                  [Volume]
                  Copy=true
