---
# An example inventory: DOCUMENTATION VALUES ONLY (RFC 5737 TEST-NET-1).
#
# No real machine, address, domain or secret lives here. Copy the whole
# directory to `inventories/<site>/`, replace the values, create the vault
# described in `group_vars/all/vault.yml.example`, and follow `README.md`. The
# example itself is never converged.
all:
  vars:
    ansible_connection: ssh
    # The account the Debian installer created. It must already exist, and it
    # owns the rootless engine.
    ansible_user: debian
    ansible_python_interpreter: /usr/bin/python3

    account_enabled: true
    account_name: container
    account_uid: 1500
    account_gid: 1500

    podman_enabled: false
    container_host_edition: server
    podman_registries:
      - docker.io

    # The site's declarations. An empty list writes nothing.
    quadlet_enabled: false
    quadlet_units: []
    # A declaration is one file in the owning account's generator directory:
    #
    #   - name: example
    #     type: container
    #     content: |
    #       [Unit]
    #       Description=Example service
    #
    #       [Container]
    #       Image=docker.io/library/alpine:3.20
    #       Exec=sleep infinity
    #
    #       [Install]
    #       WantedBy=default.target
    #
    # The role does not pull the image or start the unit; it writes the file,
    # reloads the user manager and reads the generated unit back.

  children:
    containers:
      hosts:
        container-01:
          ansible_host: 192.0.2.10
